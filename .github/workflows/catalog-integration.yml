name: Live catalog acceptance

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'Exact tested Paimon REST or DLF server version'
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: catalog-integration
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Exercise isolated catalog
        env:
          PAIMON_ACC_URI: ${{ secrets.PAIMON_ACC_URI }}
          PAIMON_ACC_ALLOW_MUTATIONS: '1'
          PAIMON_ACC_PRINCIPAL: ${{ secrets.PAIMON_ACC_PRINCIPAL }}
          TF_VAR_paimon_warehouse: ${{ secrets.PAIMON_WAREHOUSE }}
          TF_VAR_paimon_token_provider: ${{ vars.PAIMON_TOKEN_PROVIDER }}
          TF_VAR_paimon_token: ${{ secrets.PAIMON_TOKEN }}
          TF_VAR_paimon_dlf_region: ${{ vars.PAIMON_DLF_REGION }}
          TF_VAR_paimon_dlf_signing_algorithm: ${{ vars.PAIMON_DLF_SIGNING_ALGORITHM }}
          TF_VAR_paimon_dlf_access_key_id: ${{ secrets.PAIMON_DLF_ACCESS_KEY_ID }}
          TF_VAR_paimon_dlf_access_key_secret: ${{ secrets.PAIMON_DLF_ACCESS_KEY_SECRET }}
          TF_VAR_paimon_dlf_security_token: ${{ secrets.PAIMON_DLF_SECURITY_TOKEN }}
          TESTED_SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          test -n "$PAIMON_ACC_PRINCIPAL" || { echo 'Configure an isolated PAIMON_ACC_PRINCIPAL to exercise all management resources' >&2; exit 1; }
          printf 'Catalog version under test: %s\n' "$TESTED_SERVER_VERSION"
          for name in ${!TF_VAR_@}; do
            if [[ -z "${!name}" ]]; then unset "$name"; fi
          done
          make test-integration
